name = "agent-ready-saas-api"
version = "1.0.0"
description = "A safe MCP server in front of a SaaS REST API, for customers' AI agents"
main = "customer_agent/main.py"                 # `promptise run`: the customer agent does one task
agent = "customer_agent.agent:create_agent"     # `promptise run chat`: talk to it

[scripts]
setup = "python scripts/setup_dev.py"           # .env with fresh dev secrets and three keys
api = "promptise run scripts/run_api.py"        # the Taskboard REST API on :8000
mcp = "promptise run scripts/run_mcp_server.py" # the MCP server on :8080/mcp
approvals = "promptise run scripts/approvals.py"  # the reviewer's console (dana@acme)
agent = "promptise run customer_agent/main.py"  # the customer agent, with a real model
agent-reader = "promptise run customer_agent/main.py -- --key-env TASKBOARD_READER_KEY"
chat = "promptise run --mode chat"
keys = "promptise run scripts/keys.py --"       # list | create ... | revoke <key_id>
audit = "promptise audit verify .data/audit.jsonl"
test = "pytest"
test-live = "pytest -m live"                    # one real end-to-end run, needs a model key
demo-offline = "promptise run demo.py"          # no model key: a scripted model, same server

[env]
files = [".env"]
