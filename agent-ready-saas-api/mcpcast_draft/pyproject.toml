[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskboard-mcp"
version = "0.1.0"
description = "MCP server for Taskboard API: Projects, tasks and comments for Taskboard workspaces. — generated by promptise mcpcast"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "promptise>=1.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
taskboard-mcp = "taskboard_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["taskboard_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned, so `ruff check` keeps its meaning when ruff's defaults change (0.16
# added rules to the default set that this generated code does not follow).
# This is your project: add the rules you want.
select = ["E4", "E7", "E9", "F"]
