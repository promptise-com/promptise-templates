[project]
name = "agent-ready-saas-api"
version = "1.0.0"
description = "A safe MCP server in front of a SaaS REST API, for customers' AI agents (Promptise example)"
requires-python = ">=3.10"
dependencies = [
    "promptise==1.8.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live test calls a real model; run it with: pytest -m live
addopts = "-m 'not live'"
markers = ["live: calls a real model provider (needs its API key)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["conftest", "customer_agent", "mcp_server", "taskboard_api"]
