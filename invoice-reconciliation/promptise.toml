# How `promptise run` runs this project, like package.json for npm.
# Reference: https://docs.promptise.com/core/projects/

name = "invoice-reconciliation"
version = "1.0.0"
description = "Finance operations agent: nightly reconciliation, failed-payment follow-up, capped refunds"
main = "main.py"

[scripts]
start = "promptise run main.py --devtools"                         # the agent, live trace on stderr
reconcile = "promptise run main.py --devtools -- --reseed --reconcile-now"  # fresh data, reconcile now
prod = "promptise run --prod"                                      # JSON logs, graceful SIGTERM
webhook = "promptise run scripts/send_test_webhook.py"             # post a signed sample Stripe event
test = "pytest -q"                                                 # offline tests
test-live = "pytest -q -m live"                                    # one real run (needs a model key)
demo-offline = "promptise run main.py -- --demo"                   # no key yet: a scripted day

[env]
files = [".env"]
vars = { FINANCE_AGENT_MODEL = "openai:gpt-5-mini", WEBHOOK_PORT = "8787" }

[dev]
observe = "standard"

[prod]
log_format = "json"
log_level = "INFO"
shutdown_timeout = 30

# USD per 1M tokens, for the cost estimate in --devtools. Check your provider's
# current prices before you rely on it.
[pricing]
"gpt-5-mini*" = { input = 0.25, output = 2.0 }
