[project]
name = "incident-response-agent"
version = "1.0.0"
description = "On-call incident agent built with Promptise: webhook trigger, runbooks, approvals, traces"
requires-python = ">=3.10"
dependencies = ["promptise==1.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
