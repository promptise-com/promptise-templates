[project]
name = "incident-response-agent"
version = "1.0.0"
description = "On-call incident agent built with Promptise: webhook trigger, runbooks, approvals, traces"
requires-python = ">=3.10"
dependencies = ["promptise==1.9.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: runs one incident with a real model (needs a provider key, costs a few cents)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
# Code excerpts in GUIDE.md and README.md must stay exact copies of the source.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
