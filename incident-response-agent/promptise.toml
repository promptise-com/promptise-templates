name = "incident-response-agent"
version = "1.0.0"
description = "On-call agent: an alert wakes it, it follows the runbook, risky fixes wait for a person"
main = "main.py"
python_path = ["."]

[scripts]
start = "promptise run main.py"
dev = "promptise run --devtools main.py"
alert = "promptise run scripts/fire_alert.py"
alert-resolved = "promptise run scripts/fire_alert.py -- --resolved"
test = "pytest -q"
test-live = "pytest -q -m live"
demo-offline = "promptise run demo.py"
demo-offline-deny = "promptise run demo.py -- --deny"

[env]
files = [".env"]
vars = { INCIDENT_AGENT_MODEL = "openai:gpt-5-mini", ALERT_WEBHOOK_PORT = "9095" }

[dev]
observe = "full"
