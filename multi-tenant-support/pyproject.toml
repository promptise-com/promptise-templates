# Dependencies are in requirements.txt. This file only configures pytest.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls a real model provider (needs an API key; skipped without one)"]

[tool.ruff]
line-length = 110
extend-exclude = [".venv", "*.md"]  # guide excerpts keep their file indentation

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "conftest", "demo", "main", "support_desk"]
